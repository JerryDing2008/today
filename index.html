<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Today</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

</head>

<body>

    <!-- 菜单 -->

    <div
        id="overlay">

    </div>

    <aside
        id="sidebar">

        <div class="sidebar-title">

            Today

        </div>

        <button
            class="nav-btn active"
            data-page="today">

            Today

        </button>

        <button
            class="nav-btn"
            data-page="archive">

            Archive

        </button>

    </aside>

    <!-- Today 页面 -->

    <main
        id="todayPage"
        class="page">

        <header
            class="header">

            <button id="menuBtn">
            ☰
            </button>

            <button id="somedayBtn">
            ◇
            </button>

            <h1 id="pageTitle">
            Today
            </h1>

        </header>

        <p
            class="subtitle">

            

        </p>

        <div
            id="dateLabel"
            class="date-label">

        </div>

        <div class="workspace">

            <div class="todo-card">

                <ul id="todoList">
                </ul>

                <div class="add-bar">

                    <input
                        id="taskInput"
                        type="text">

                    <button
                        id="addBtn">

                        ADD

                    </button>

                </div>

            </div>

            <div id="detailPanel">

                <div class="empty-detail">

                    <div class="empty-title">

                        Today

                    </div>

                    <div class="empty-subtitle">

                        选择一个待办事项

                    </div>

                    <div class="empty-desc">

                        在这里查看详细说明<br>
                        并记录一些想法。

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Archive 页面 -->

    <main
        id="archivePage"
        class="page hidden">

        <header
            class="header">

            <button
                id="backBtn">

                ←

            </button>

            <h1>

                Archive

            </h1>

        </header>

        <p
            class="subtitle">

            已归档的过去。

        </p>

        <div
            id="archiveList"
            class="archive-list">

        </div>

    </main>

    <script
        src="app.js">

    </script>

</body>

</html>
